  ]],
  ['Everything else', [
    [['1', '2', '3'], 'Show all, active, or done'],
    [['Ctrl', 'Z'], 'Undo the last delete'],
  ]],
];

function openHelp() {
  dlgHelp.innerHTML = `
    <div class="dlg-head">
      <h2>Keyboard</h2>
      <button type="button" class="icon-btn" data-act="close-dialog" aria-label="Close">${ICON.close}</button>
    </div>
    <div class="dlg-body help-body">
      ${KEYMAP.map(([title, rows]) => `
        <div class="help-group">
          <h3>${title}</h3>
          ${rows.map(([keys, what]) => `
            <div class="help-row">
              <span class="help-keys">${keys.map(k => `<span class="kbd">${k}</span>`).join('')}</span>
              <span>${what}</span>
            </div>`).join('')}
        </div>`).join('')}
    </div>`;
  openDialog(dlgHelp);
  dlgHelp.querySelector('[data-act="close-dialog"]')?.focus();
}

/* ═════════════════════════════════════════════════════════════════════════
   DRAG AND DROP — the mouse equivalent of Alt+arrows and M
   Tasks move within and between sections; sections reorder by their tab.
   Classes are poked directly during a drag rather than re-rendering, so
   the drag image survives.
   ═════════════════════════════════════════════════════════════════════════ */
let drag = null;   // { kind: 'task' | 'section', id }

const drawerEl = $('#drawer');

drawerEl.addEventListener('dragstart', e => {
  const tab = e.target.closest('.tab');
  const task = e.target.closest('.task');
  if (tab) {
    drag = { kind: 'section', id: tab.closest('.folder').dataset.section };
  } else if (task) {
    drag = { kind: 'task', id: task.dataset.task };
    task.classList.add('is-dragging');
  } else return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', drag.id);
});

drawerEl.addEventListener('dragend', endDrag);

drawerEl.addEventListener('dragover', e => {
  if (!drag) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  clearDropHints();

  if (drag.kind === 'section') {
    const folder = e.target.closest('.folder');
    if (!folder || folder.dataset.section === drag.id) return;
    const r = folder.getBoundingClientRect();
    folder.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
    return;
  }

  const row = e.target.closest('.task');
  if (row) {
    if (row.dataset.task === drag.id) return;
    const r = row.getBoundingClientRect();
    row.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
    return;
  }
  const folder = e.target.closest('.folder');
  if (folder) folder.classList.add('is-drop-target');   // drop at the end of it
});

drawerEl.addEventListener('drop', e => {
  if (!drag) return;
  e.preventDefault();

  if (drag.kind === 'section') {
    const folder = e.target.closest('.folder');
    const dragged = drag.id;
    endDrag();
    if (!folder || folder.dataset.section === dragged) return;
    const list = sections().filter(s => s.id !== dragged);
    const r = folder.getBoundingClientRect();
    const at = list.findIndex(s => s.id === folder.dataset.section)
             + (e.clientY < r.top + r.height / 2 ? 0 : 1);
    const sec = sectionById(dragged);
    sec.order = keyAt(list, at);
    state.cursor = { type: 'section', id: sec.id };
    commit();
    return;
  }

  const row = e.target.closest('.task');
  const folder = e.target.closest('.folder');
  const id = drag.id;
  endDrag();

  if (row && row.dataset.task !== id) {
    const target = taskById(row.dataset.task);
    const r = row.getBoundingClientRect();
    const siblings = tasksIn(target.sectionId).filter(t => t.id !== id);
    const at = siblings.findIndex(t => t.id === target.id) + (e.clientY < r.top + r.height / 2 ? 0 : 1);
    moveTaskToSection(id, target.sectionId, at);
  } else if (folder) {
    moveTaskToSection(id, folder.dataset.section, null);
  }
});

/* Deliberately leaves .is-dragging alone — dragover fires constantly, and
   stripping it there would un-dim the row you are still holding. */
function clearDropHints() {
  drawerEl.querySelectorAll('.drop-before, .drop-after, .is-drop-target')
    .forEach(el => el.classList.remove('drop-before', 'drop-after', 'is-drop-target'));
}
function endDrag() {
  drag = null;
  clearDropHints();
  drawerEl.querySelectorAll('.is-dragging').forEach(el => el.classList.remove('is-dragging'));
}

/* ═════════════════════════════════════════════════════════════════════════
   BOOT
   ═════════════════════════════════════════════════════════════════════════ */
// the top bar grows a hairline once the drawer scrolls under it
const topbar = $('#topbar');
addEventListener('scroll', () => topbar.classList.toggle('is-stuck', window.scrollY > 6), { passive: true });

// a second tab editing the same drawer shouldn't quietly diverge
addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  const typingHere = document.activeElement === captureInput;
  const mine = captureInput.value;
  load();
  // Never clobber a draft being typed in this tab.
  if (typingHere) state.captureDraft = mine; else captureInput.value = state.captureDraft ?? '';
  render();
  toast('Another tab changed this drawer, so it reloaded here.');
});

load();
captureInput.value = state.captureDraft ?? '';
render();   // render() settles the cursor itself, on a fresh drawer too

// Pick up the draft where it was left; otherwise leave focus alone, so a
// reload doesn't yank you somewhere you never were.
if (state.captureDraft) {
  captureInput.focus();
  captureInput.setSelectionRange(captureInput.value.length, captureInput.value.length);
}

/* Sanity checks for the vendored order-key code. Off unless you ask:
   open this file with #test on the URL and watch the console. */
if (location.hash === '#test') {
  const eq = (a, b, what) => console.assert(a === b, what, '→ got', a, 'want', b);
  eq(generateKeyBetween(null, null), 'a0', 'first key');
  eq(generateKeyBetween('a0', null), 'a1', 'append');
  eq(generateKeyBetween(null, 'a0'), 'Zz', 'prepend');
  eq(generateKeyBetween('a0', 'a1'), 'a0V', 'between');
  eq(generateKeyBetween('a0V', 'a1'), 'a0l', 'between again');
  eq(generateKeyBetween('Zz', 'a0'), 'ZzV', 'across the boundary');
  eq(generateNKeysBetween(null, null, 3).join(' '), 'a0 a1 a2', 'three at once');
  const many = generateNKeysBetween('a0', 'a1', 5);
  eq(String(many.length), '5', 'five between');
  eq(String([...many].sort().join() === many.join()), 'true', 'five stay sorted');
  console.log('%cSimpleGTD order keys: checks finished', 'color:#0E4A42;font-weight:700');
}
</script>
